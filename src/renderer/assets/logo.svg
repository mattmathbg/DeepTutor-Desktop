<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="45" fill="url(#glowGrad)" filter="url(#blurFilter)" />

  <!-- Outer Orbit Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Background Base -->
  <rect x="25" y="25" width="70" height="70" rx="20" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Brain / Graduation Cap Geometric Motif -->
  <!-- Cap / Academic Base -->
  <polygon points="60,38 85,50 60,62 35,50" fill="url(#primaryGrad)" />
  <!-- Under arch / book pages -->
  <path d="M 42 58 L 42 70 C 42 76, 54 81, 60 81 C 66 81, 78 76, 78 70 L 78 58 C 72 63, 64 65, 60 65 C 56 65, 48 63, 42 58 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Neural spark node -->
  <circle cx="60" cy="50" r="3.5" fill="#ffffff" />
  <circle cx="85" cy="50" r="2.5" fill="#a855f7" />
</svg>
