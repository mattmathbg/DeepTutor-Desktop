<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="splashBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="560" rx="16" fill="url(#splashBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#00f2fe" opacity="0.1" filter="url(#softOrb)" />
  <circle cx="720" cy="180" r="160" fill="#7c3aed" opacity="0.12" filter="url(#softOrb)" />

  <!-- App Header -->
  <g transform="translate(425, 45)">
    <!-- Glowing Ring & App Logo -->
    <circle cx="0" cy="30" r="38" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="2" />
    <circle cx="0" cy="30" r="38" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="140 100" stroke-linecap="round" filter="url(#splashGlow)" />
    <rect x="-24" y="6" width="48" height="48" rx="12" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="1.5" />
    <path d="M -10 38 L 0 16 L 10 38 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linejoin="round" />
    <circle cx="0" cy="30" r="3" fill="#10b981" />

    <!-- Branding Text -->
    <text x="0" y="96" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="24" font-weight="800" letter-spacing="0.5">DeepTutor</text>
    <text x="0" y="116" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="13" font-weight="500">Lifelong Personalized Tutoring — Orchestrateur Natif</text>
  </g>

  <!-- Main Glass Container Card -->
  <g transform="translate(60, 185)">
    <rect width="730" height="310" rx="16" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

    <!-- Step Tracker (1 to 4) -->
    <g transform="translate(55, 30)">
      <!-- Line 1-2 -->
      <line x1="45" y1="20" x2="200" y2="20" stroke="#10b981" stroke-width="2.5" />
      <!-- Line 2-3 -->
      <line x1="245" y1="20" x2="400" y2="20" stroke="#10b981" stroke-width="2.5" />
      <!-- Line 3-4 -->
      <line x1="445" y1="20" x2="580" y2="20" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 4" />

      <!-- Step 1: Completed -->
      <circle cx="20" cy="20" r="16" fill="#10b981" filter="url(#splashGlow)" />
      <path d="M 14 20 L 18 24 L 26 15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="20" y="52" text-anchor="middle" fill="#10b981" class="font-sans" font-size="12" font-weight="700">Docker</text>

      <!-- Step 2: Completed -->
      <circle cx="225" cy="20" r="16" fill="#10b981" filter="url(#splashGlow)" />
      <path d="M 219 20 L 223 24 L 231 15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="225" y="52" text-anchor="middle" fill="#10b981" class="font-sans" font-size="12" font-weight="700">Mise à jour</text>

      <!-- Step 3: Active Pulsing -->
      <circle cx="425" cy="20" r="18" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2.5" filter="url(#splashGlow)" />
      <circle cx="425" cy="20" r="7" fill="#00f2fe" />
      <text x="425" y="52" text-anchor="middle" fill="#00f2fe" class="font-sans" font-size="12" font-weight="700">Conteneurs</text>

      <!-- Step 4: Pending -->
      <circle cx="600" cy="20" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text x="600" y="25" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="13" font-weight="700">4</text>
      <text x="600" y="52" text-anchor="middle" fill="#64748b" class="font-sans" font-size="12" font-weight="600">DeepTutor</text>
    </g>

    <!-- Status Badge & Live Messages -->
    <g transform="translate(365, 120)">
      <!-- Badge -->
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.35)" />
      <circle cx="-65" cy="0" r="4.5" fill="#00f2fe" filter="url(#splashGlow)" />
      <text x="-50" y="4.5" fill="#00f2fe" class="font-sans" font-size="12" font-weight="700">Démarrage des services</text>
      
      <!-- Primary message -->
      <text x="0" y="38" text-anchor="middle" fill="#f8fafc" class="font-sans" font-size="15" font-weight="600">Lancement des conteneurs via Docker Compose...</text>
      <!-- Subtitle -->
      <text x="0" y="58" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="12">Port 3782 • Attente de la sonde de santé HTTP (Healthcheck)</text>
    </g>

    <!-- Neon Progress Bar -->
    <g transform="translate(100, 200)">
      <rect width="530" height="6" rx="3" fill="#1e293b" />
      <rect width="380" height="6" rx="3" fill="url(#cyanGrad)" filter="url(#splashGlow)" />
    </g>

    <!-- Live Console Terminal Preview (Folded/Drawer) -->
    <g transform="translate(50, 230)">
      <rect width="630" height="62" rx="10" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.07)" />
      <!-- Header bar -->
      <path d="M 18 20 L 26 26 L 18 32" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
      <text x="36" y="28" fill="#cbd5e1" class="font-mono" font-size="12">[Docker] Container deeptutor-app Started (healthy)</text>
      <text x="36" y="48" fill="#64748b" class="font-mono" font-size="11.5">[Healthcheck] HTTP Probe 127.0.0.1:3782 → Response code: 200 OK</text>
      <text x="595" y="28" text-anchor="end" fill="#10b981" class="font-mono" font-size="11">● LIVE</text>
    </g>
  </g>

  <!-- Window Footer -->
  <g transform="translate(60, 525)">
    <circle cx="10" cy="5" r="4" fill="#10b981" filter="url(#splashGlow)" />
    <text x="24" y="9" fill="#94a3b8" class="font-sans" font-size="12">Orchestration en cours d'exécution</text>

    <text x="730" y="9" text-anchor="end" fill="#64748b" class="font-sans" font-size="12">
      <tspan fill="#38bdf8">HKUDS/DeepTutor</tspan> • v1.0.0 (Desktop Edition)
    </text>
  </g>
</svg>
