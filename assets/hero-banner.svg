<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="55%" stop-color="#0a0c16" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b06ab3" />
      <stop offset="100%" stop-color="#4568dc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 52px; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #00f2fe; }
    .glass-card { rx: 16px; fill: url(#cardGrad); stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.5; }
    .pulse-ring { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  
  <!-- Glowing Ambient Lights -->
  <circle cx="280" cy="180" r="160" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="950" cy="420" r="190" fill="#a855f7" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="600" cy="500" r="140" fill="#38ef7d" opacity="0.08" filter="url(#softGlow)" />

  <!-- Grid Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Header Branding -->
  <g transform="translate(80, 75)">
    <!-- App Logo Icon -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="16" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
      <path d="M 18 42 L 32 16 L 46 42 Z" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="32" cy="33" r="4.5" fill="#38ef7d" filter="url(#glow)"/>
    </g>
    
    <!-- Title & Tagline -->
    <text x="85" y="44" class="title">DeepTutor <tspan fill="url(#accentGrad)">Desktop</tspan></text>
    <text x="85" y="78" class="subtitle">1-Click Native Desktop Orchestrator for HKUDS/DeepTutor</text>
  </g>

  <!-- Left Glass Card: Splashscreen Cyberpunk UI Simulation -->
  <g transform="translate(80, 190)">
    <!-- Window Container -->
    <rect width="480" height="370" class="glass-card" />
    
    <!-- Window Bar -->
    <rect width="480" height="40" rx="16" fill="rgba(15, 23, 42, 0.75)" />
    <circle cx="28" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="48" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="68" cy="20" r="5.5" fill="#10b981" />
    <text x="240" y="25" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">DeepTutor Orchestrator — Initializing Engine</text>

    <!-- Center Glowing Reactor Animation Placeholder -->
    <g transform="translate(240, 150)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="6" />
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-dasharray="160 120" stroke-linecap="round" filter="url(#glow)" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-dasharray="80 80" />
      <circle cx="0" cy="0" r="16" fill="url(#neonCyan)" opacity="0.9" filter="url(#glow)" />
      
      <!-- Logo inside reactor -->
      <path d="M -7 6 L 0 -8 L 7 6 Z" fill="#090d16" />
    </g>

    <!-- Status Step List -->
    <g transform="translate(40, 240)">
      <!-- Step 1 -->
      <circle cx="10" cy="10" r="8" fill="#10b981" />
      <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="30" y="14" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Docker Engine Daemon</text>
      <text x="360" y="14" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">ONLINE</text>

      <!-- Step 2 -->
      <circle cx="10" cy="42" r="8" fill="#10b981" />
      <path d="M 7 42 L 9 44 L 13 40" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="30" y="46" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Image ghcr.io/hkuds/deeptutor</text>
      <text x="360" y="46" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">PULLED</text>

      <!-- Step 3 -->
      <circle cx="10" cy="74" r="8" fill="#00f2fe" filter="url(#glow)" />
      <circle cx="10" cy="74" r="4" fill="#ffffff" />
      <text x="30" y="78" fill="#38ef7d" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Healthcheck Web Server (3782)</text>
      <text x="360" y="78" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">CONNECTING...</text>
    </g>
  </g>

  <!-- Right Glass Card: Key Benefits & Features Matrix -->
  <g transform="translate(600, 190)">
    <rect width="520" height="370" class="glass-card" />
    
    <!-- Feature 1 -->
    <g transform="translate(30, 35)">
      <rect width="48" height="48" rx="12" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.3)" />
      <text x="24" y="32" font-size="22" text-anchor="middle">⚡</text>
      <text x="64" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Zero Command Line Setup</text>
      <text x="64" y="46" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">No Git clone, no npm install, no Python venv. Launch &amp; go.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(30, 115)">
      <rect width="48" height="48" rx="12" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="24" y="32" font-size="22" text-anchor="middle">🐳</text>
      <text x="64" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Automated Background Docker</text>
      <text x="64" y="46" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">Auto-starts Docker Desktop, pulls latest images &amp; frees RAM on exit.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(30, 195)">
      <rect width="48" height="48" rx="12" fill="rgba(56, 239, 125, 0.12)" stroke="rgba(56, 239, 125, 0.3)" />
      <text x="24" y="32" font-size="22" text-anchor="middle">💾</text>
      <text x="64" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Persistent Local Data &amp; LLMs</text>
      <text x="64" y="46" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">Conversations saved in ./data. Connect to Ollama, LM Studio or Cloud APIs.</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(30, 275)">
      <rect width="48" height="48" rx="12" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
      <text x="24" y="32" font-size="22" text-anchor="middle">🖥️</text>
      <text x="64" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Native Desktop Window &amp; Tray</text>
      <text x="64" y="46" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">Distraction-free frame, system tray controls and instant minimize/restore.</text>
    </g>
  </g>
</svg>
